name: build apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: get project
        uses: actions/checkout@v4

      - name: extract zip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o voxel_sandbox.zip -d game

      - name: find project files
        id: project
        run: |
          file=$(find game -name project.godot -print -quit)
          if [ -z "$file" ]; then
            echo "project.godot not found"
            exit 1
          fi
          dir=$(dirname "$file")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ ! -f "$dir/export_presets.cfg" ]; then
            echo "export_presets.cfg not found next to project.godot"
            find game -name export_presets.cfg
            exit 1
          fi

      - name: setup android
        uses: android-actions/setup-android@v3

      - name: export android
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ${{ steps.project.outputs.dir }}
          relative_export_path: build
          presets_to_export: Android
          archive_output: false

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/*.apk
          if-no-files-found: error
