name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Export Godot project to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          if [ ! -f "voxel_sandbox.zip" ]; then
            echo "ERROR: voxel_sandbox.zip not found in repository root"
            exit 1
          fi
          unzip -o voxel_sandbox.zip -d game

      - name: Find and validate project
        id: project
        shell: bash
        run: |
          file="$(find game -type f -name project.godot -print -quit)"

          if [ -z "$file" ]; then
            echo "ERROR: project.godot not found inside ZIP"
            exit 1
          fi

          dir="$(dirname "$file")"

          if [ ! -f "$dir/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found beside project.godot"
            exit 1
          fi

          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ${{ steps.project.outputs.dir }}
          relative_export_path: build
          presets_to_export: Android
          archive_output: false
          export_debug: true

      - name: Verify APK exists
        shell: bash
        run: |
          find build -type f -name '*.apk' -print

          if ! find build -type f -name '*.apk' -print -quit | grep -q .; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/**/*.apk
          if-no-files-found: error
